name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 tests/test_plugin.py
      - run: python3 -m json.tool .claude-plugin/plugin.json > /dev/null
      - run: python3 -m json.tool .codex-plugin/plugin.json > /dev/null
      - run: python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
